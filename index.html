<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Make games for Arduboy and home made Arduboy compatible devices with blocks." />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>ArduCade</title>
  </head>
  <body>
    <header class="topbar">
      <button id="btn-home" class="brand" aria-label="ArduCade" data-i18n-title="home.back">
        <img src="logo.svg" alt="ArduCade" width="145" height="40" />
      </button>
      <input id="project-name" class="project-name" type="text" data-i18n-title="project.name" spellcheck="false" />
      <nav class="actions">
        <button id="btn-guides" data-i18n="guide.worldMenu"></button>
        <button id="btn-new" data-i18n="menu.new"></button>
        <button id="btn-open" data-i18n="menu.open"></button>
        <button id="btn-import" data-i18n="menu.import"></button>
        <button id="btn-export" class="primary" data-i18n="menu.export"></button>
      </nav>
      <span class="spacer"></span>
      <div id="language-picker" class="language-picker">
        <button id="lang" type="button" data-i18n-title="settings.language" aria-haspopup="menu" aria-expanded="false" aria-controls="language-menu"></button>
        <div id="language-menu" class="language-menu" role="menu" data-i18n-title="settings.language" hidden></div>
      </div>
      <button id="btn-docs" data-i18n="menu.docs"></button>
      <button id="btn-settings" data-i18n="menu.settings"></button>
    </header>

    <main id="home" class="home" hidden></main>
    <main id="editor-layout" class="layout">
      <section class="editor">
        <nav class="tabs" role="tablist">
          <button role="tab" data-tab="blocks" class="active" data-i18n="tab.blocks"></button>
          <button role="tab" data-tab="images" data-i18n="tab.images"></button>
          <button role="tab" data-tab="tiles" data-i18n="tab.tiles"></button>
          <button role="tab" data-tab="map" data-i18n="tab.map"></button>
          <button role="tab" data-tab="code" data-i18n="tab.code"></button>
          <button role="tab" data-tab="javascript">JavaScript</button>
          <button role="tab" data-tab="python">Python</button>
          <button id="btn-comments" type="button" aria-pressed="false" aria-controls="comments-panel" data-i18n="comments.toggle"></button>
        </nav>
        <div class="pane active" id="pane-blocks" role="tabpanel"><div class="block-search"><button type="button" class="block-search-toggle" data-i18n-title="blocks.search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button><input id="block-search" type="search" size="1" data-i18n-placeholder="blocks.search" data-i18n-title="blocks.search" autocomplete="off"></div><div class="blocks-content"><div id="blockly"></div><aside id="comments-panel" hidden></aside></div></div>
        <div class="pane assets" id="pane-images" role="tabpanel"></div>
        <div class="pane assets" id="pane-tiles" role="tabpanel"></div>
        <div class="pane" id="pane-map" role="tabpanel"></div>
        <div class="pane text-pane" id="pane-javascript" role="tabpanel">
          <div class="code-head"><span class="muted small" data-i18n="code.textHelp"></span><button class="small" data-restore-blocks data-i18n="code.restoreBlocks"></button></div>
          <div id="javascript-editor" class="text-editor"></div>
        </div>
        <div class="pane text-pane" id="pane-python" role="tabpanel">
          <div class="code-head"><span class="muted small" data-i18n="code.textHelp"></span><button class="small" data-restore-blocks data-i18n="code.restoreBlocks"></button></div>
          <div id="python-editor" class="text-editor"></div>
        </div>
        <div class="pane" id="pane-code" role="tabpanel">
          <div class="code-head">
            <span class="muted small" data-i18n="code.help"></span>
            <button id="btn-copy-code" class="small" data-i18n="code.copy"></button>
          </div>
          <pre id="code" class="code" tabindex="0"></pre>
        </div>

      </section>

      <aside class="side">
        <div class="side-content">
        <div id="sim-shell" class="sim-shell">
        <div class="sim" id="sim" tabindex="0" data-i18n-title="sim.focus">
          <button id="btn-sim-size" class="sim-control sim-size" data-i18n-title="sim.sizeSmall" hidden></button>
          <div class="screen-frame"><canvas id="screen" width="128" height="64"></canvas></div>
          <div class="pad" aria-hidden="false">
            <div class="dpad">
              <button data-btn="up" class="up" data-i18n-title="button.up">&#9650;</button>
              <button data-btn="left" class="left" data-i18n-title="button.left">&#9664;</button>
              <button data-btn="right" class="right" data-i18n-title="button.right">&#9654;</button>
              <button data-btn="down" class="down" data-i18n-title="button.down">&#9660;</button>
            </div>
            <div class="sim-bar">
              <button id="btn-run" class="primary sim-control" data-i18n-title="sim.play"></button>
              <button id="btn-stop" class="sim-control" data-i18n-title="sim.stop"></button>
              <button id="btn-restart" class="sim-control" data-i18n-title="sim.restart"></button>
              <button id="btn-mute" class="sim-control" data-i18n-title="sim.mute"></button>
              <button id="btn-sim-view" class="sim-control" data-i18n-title="sim.standalone"></button>
              <button id="btn-sim-color" class="sim-control" data-i18n-title="sim.color"></button>
            </div>
            <div class="ab">
              <button data-btn="b" class="b">B</button>
              <button data-btn="a" class="a">A</button>
            </div>
          </div>
        </div>
        <div id="sim-message" class="sim-message" role="status"></div>
        <p class="muted small keys" data-i18n="sim.keys"></p>
        </div>

        <div class="panel guide-panel" id="guide-panel" hidden></div>

        <div class="panel" id="problems-panel">
          <h3 data-i18n="problems.title"></h3>
          <ul id="problems" class="problems"></ul>
        </div>


        <div class="panel tips" id="tips-panel" hidden>
          <h3 data-i18n="tips.title"></h3>
          <ol id="tips"></ol>
        </div>
        </div>
        <footer class="side-device-bar">
          <div id="meter-summary" class="meter-summary"></div>
          <button id="btn-device-export" class="primary" data-i18n="device.export"></button>
        </footer>
      </aside>
    </main>
    <div id="device-panel-home" hidden>
        <div class="device" id="device-panel">
          <h3 data-i18n="device.title"></h3>
          <div class="row">
            <span id="profile-name" class="grow"></span>
            <button id="btn-profile" class="small" data-i18n="device.change"></button>
          </div>
          <div class="meter" id="meter"></div>
          <div class="row wrap">
            <button id="btn-compile" data-i18n="device.compile"></button>
            <button id="btn-upload" class="primary" data-i18n="device.upload"></button>
            <button id="btn-sketch" data-i18n="device.sketch"></button>
          </div>
          <p id="device-status" class="muted small" role="status"></p>
        </div>

    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
