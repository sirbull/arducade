    <text class="st22" transform="translate(64 1266)"><tspan x="0" y="0">ISP: RESET / 1 · MOSI = PB0 / 5 · MISO = PB1 / 6 · SCK = PB2 / 7 · VCC / 8 · GND / 4</tspan></text>
    <text class="st21" transform="translate(64 1305)"><tspan x="0" y="0">Front: display, buttons, piezo and socket. Back: battery and switch. Check the mirrored underside.</tspan></text>
    <text class="st40" transform="translate(40 1383)"><tspan x="0" y="0">ArduCade wiring based on the sunyecz06 reference. Buttons changed to active LOW. Not to scale.</tspan></text>
