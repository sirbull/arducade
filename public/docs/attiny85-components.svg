    <text class="st28" transform="translate(64 655)"><tspan x="0" y="0">PB0–PB4 differ from physical DIP pin numbers.</tspan></text>
    <text class="st28" transform="translate(64 683)"><tspan x="0" y="0">Use a DIP-8 socket to swap or program the chip.</tspan></text>
