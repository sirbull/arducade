    <text class="st29" transform="translate(40 58)"><tspan x="0" y="0">ATtiny85 · components and connections</tspan></text>
    <text class="st8" transform="translate(40 96)"><tspan x="0" y="0">ArduCade · ATtiny85 Pico · 8 MHz internal clock · one 3 V battery</tspan></text>
    <text class="st26" transform="translate(40 131)"><tspan x="0" y="0">Matching pin names mean the same connection. Numbers after / are physical DIP pins, viewed from above.</tspan></text>
