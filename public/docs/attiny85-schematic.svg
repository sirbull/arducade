    <text class="st1" transform="translate(40 96)"><tspan x="0" y="0">ArduCade · ATtiny85 Pico · 8 MHz internal clock · one 3 V battery</tspan></text>
    <text class="st14" transform="translate(40 132)"><tspan x="0" y="0">Matching net names mean an electrical connection. ArduCade buttons are active LOW, unlike the reference PDF.</tspan></text>
