<!doctype html><html lang="nb"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><title>ArduCade · Musikkveiledning</title><link rel="stylesheet" href="/src/styles.css">
<body><header style="height:52px;padding:12px 20px;border-bottom:2px solid var(--border);background:var(--panel);font-size:20px"><strong>Ardu<span style="color:var(--accent)">Cade</span></strong> · Musikk</header><main id="studio" class="pane assets active" style="height:calc(100vh - 52px)"></main>
<script type="module">
import { MUSIC_EXAMPLES } from '/src/ui/docs-music-examples.ts';
import { MusicPane } from '/src/ui/music-studio.ts';
import { newProject } from '/src/project/model.ts';
import { loadLanguage } from '/src/i18n/i18n.ts';
import { applyPageTheme } from '/src/ui/themes.ts';
import { openMelodyRecorder } from '/src/ui/melody-recorder.ts';
await loadLanguage('nb');applyPageTheme('color');
const p=newProject('Musikkeksempler');
p.melodies.push({id:'coin-guide',name:'mynt',notes:MUSIC_EXAMPLES.melody,tempo:160});
p.songs.push({id:'song-guide',name:'skogstur',tempo:120,voices:[...MUSIC_EXAMPLES.voices]});
const root=document.querySelector('#studio'), pane=new MusicPane(root,{project:()=>p,changed:()=>{}});pane.render();
const view=new URL(location.href).searchParams.get('view');
if(view==='poly') [...root.querySelectorAll('[role="tab"]')].find(b=>b.getAttribute('aria-selected')==='false').click();
if(view==='recorder')openMelodyRecorder(p.melodies[0].notes,p.melodies[0].tempo,()=>{});
if(view==='docs'){
 await import('blockly/blocks');
 const {defineBlocks}=await import('/src/blocks/defs.ts');const {setAssetProject}=await import('/src/blocks/assets.ts');const {renderDocs}=await import('/src/ui/docs.ts');
 defineBlocks();setAssetProject(p);root.className='dialog-body';if(new URL(location.href).searchParams.has('tablet'))root.style.width='820px';root.replaceChildren();renderDocs(root,'color','sound');
}
</script></body></html>
